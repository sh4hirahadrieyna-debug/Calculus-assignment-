<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Integration Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fb;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            margin-top: 0;
            color: #1a73e8;
            font-size: 24px;
            text-align: center;
        }
        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            .layout { grid-template-columns: 1fr; }
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-weight: 600;
            font-size: 14px;
            color: #5f6368;
        }
        input {
            padding: 10px;
            border: 1px solid #dadce0;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #1a73e8;
        }
        .result-box {
            margin-top: 10px;
            padding: 15px;
            background: #e8f0fe;
            border-radius: 6px;
            border-left: 5px solid #1a73e8;
        }
        .result-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #1a73e8;
            font-weight: bold;
        }
        .result-value {
            font-size: 22px;
            font-weight: bold;
            margin-top: 5px;
        }
        .error {
            color: #d93025;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        .graph-container {
            position: relative;
            min-height: 400px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Definite Integral Calculator & Visualizer</h1>
    
    <div class="layout">
        <div class="controls">
            <div class="input-group">
                <label for="function">Function f(x)</label>
                <input type="text" id="function" value="x^2 - 2x + 1" placeholder="e.g., sin(x), x^2">
                <div id="error-msg" class="error">Invalid expression</div>
            </div>
            
            <div class="input-group">
                <label for="lower-bound">Lower Bound (a)</label>
                <input type="number" id="lower-bound" value="0" step="any">
            </div>
            
            <div class="input-group">
                <label for="upper-bound">Upper Bound (b)</label>
                <input type="number" id="upper-bound" value="3" step="any">
            </div>

            <div class="result-box">
                <div class="result-title">Definite Integral Area</div>
                <div class="result-value" id="result">0.0000</div>
            </div>
        </div>

        <div class="graph-container">
            <canvas id="myChart"></canvas>
        </div>
    </div>
</div>

<script>
    let myChart = null;

    // Simpson's Rule for Numerical Integration
    function simpsonsRule(f, a, b, n = 100) {
        if (n % 2 !== 0) n++; // n must be even
        const h = (b - a) / n;
        let sum = f(a) + f(b);

        for (let i = 1; i < n; i++) {
            const x = a + i * h;
            sum += i % 2 === 0 ? 2 * f(x) : 4 * f(x);
        }
        return (h / 3) * sum;
    }

    function calculateAndGraph() {
        const formulaInput = document.getElementById('function').value;
        const a = parseFloat(document.getElementById('lower-bound').value);
        const b = parseFloat(document.getElementById('upper-bound').value);
        const errorMsg = document.getElementById('error-msg');
        
        errorMsg.style.display = 'none';

        try {
            // Compile user math string using Math.js
            const parsedExpr = math.compile(formulaInput);
            const f = (x) => parsedExpr.evaluate({ x: x });

            // Validate evaluation test
            f(a);

            // 1. Calculate the Definite Integral
            let integralResult = 0;
            if (!isNaN(a) && !isNaN(b) && a !== b) {
                integralResult = simpsonsRule(f, a, b);
            }
            document.getElementById('result').textContent = isNaN(integralResult) ? "Undefined" : integralResult.toFixed(4);

            // 2. Generate Data Points for Graphing
            // We expand the view slightly past bounds [a, b] for context
            const margin = Math.abs(b - a) * 0.5 || 2; 
            const xMin = Math.min(a, b) - margin;
            const xMax = Math.max(a, b) + margin;
            
            const totalPoints = 200;
            const step = (xMax - xMin) / totalPoints;
            
            const linePoints = [];
            const filledPoints = [];

            for (let i = 0; i <= totalPoints; i++) {
                const x = xMin + i * step;
                try {
                    const y = f(x);
                    if (typeof y === 'number' && !isNaN(y) && isFinite(y)) {
                        linePoints.push({ x: x, y: y });
                        
                        // If x falls within the integration bounds [a, b], map it for shading
                        if (x >= Math.min(a, b) && x <= Math.max(a, b)) {
                            filledPoints.push({ x: x, y: y });
                        }
                    }
                } catch(e) {}
            }

            updateChart(linePoints, filledPoints, a, b);

        } catch (err) {
            errorMsg.textContent = "Error parsing function.";
            errorMsg.style.display = 'block';
        }
    }

    function updateChart(lineData, fillData, a, b) {
        const ctx = document.getElementById('myChart').getContext('2d');

        if (myChart) {
            myChart.destroy();
        }

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [
                    {
                        label: 'f(x)',
                        data: lineData,
                        borderColor: '#1a73e8',
                        borderWidth: 3,
                        pointRadius: 0,
                        fill: false,
                        tension: 0.1
                    },
                    {
                        label: 'Integrated Area',
                        data: fillData,
                        backgroundColor: 'rgba(26, 115, 232, 0.25)',
                        borderColor: 'transparent',
                        pointRadius: 0,
                        fill: 'origin', // Fills area to the x-axis (y=0)
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'linear',
                        position: 'bottom',
                        grid: { color: '#e0e0e0' },
                        title: { display: true, text: 'x' }
                    },
                    y: {
                        type: 'linear',
                        grid: { color: '#e0e0e0' },
                        title: { display: true, text: 'y' }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });
    }

    // Attach event listeners for real-time calculation updates
    document.getElementById('function').addEventListener('input', calculateAndGraph);
    document.getElementById('lower-bound').addEventListener('input', calculateAndGraph);
    document.getElementById('upper-bound').addEventListener('input', calculateAndGraph);

    // Initial run on page load
    window.onload = calculateAndGraph;
</script>

</body>
</html>
